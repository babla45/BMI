<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI CALCULATOR</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="functions.js"></script>
    <style>
        .active-underweight {
            background-image: linear-gradient(to right, #38bdf8, #2563eb); /* Sky to Blue */
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .active-normal {
            background-image: linear-gradient(to right, #34d399, #059669); /* Light Emerald to Dark Emerald */
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .active-overweight {
            background-image: linear-gradient(to right, #fbbf24, #d97706); /* Amber to Dark Amber */
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .active-obese {
            background-image: linear-gradient(to right, #f87171, #dc2626); /* Light Red to Dark Red */
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans p-6 md:p-8 lg:p-10">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h3 class="text-2xl md:text-3xl font-bold">
                Calculate Your 
                <span class="text-blue-600">B<span class="text-purple-600">M</span>I</span>
                <span class="block md:inline"></span>
                <span class="text-gray-500">(</span><span class="text-blue-600">B</span>ody 
                <span class="text-blue-600">M</span>ass 
                <span class="text-blue-600">I</span>ndex<span class="text-gray-500">)</span>
            </h3>
        </div>

        <!-- Real-time calculation toggle -->
        <div class="mb-6 flex justify-center">
            <label class="inline-flex items-center cursor-pointer">
                <span class="mr-3 text-sm font-medium text-gray-700">Manual Calculation</span>
                <div class="relative">
                    <input type="checkbox" id="realtime-toggle" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                </div>
                <span class="ml-3 text-sm font-medium text-gray-700">Real-time Calculation</span>
            </label>
        </div>

        <div class="space-y-6">
            <!-- Height inputs -->
            <div class="space-y-2">
                <label class="font-bold text-gray-700 block">Enter your height:</label>
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1 flex space-x-2">
                        <input class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bmi-input" id="intHeight" type="number" value="0">
                        <select class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white bmi-input" id="intHeightMenu">
                            <option value="feet">Feet</option>
                            <option value="meter">Meter</option>
                            <option value="inch">Inch</option>
                            <option value="centimeter">Centimeter</option>
                        </select>
                    </div>
                    
                    <div class="flex-1 flex space-x-2">
                        <input class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bmi-input" id="fractionHeight" type="number" value="0">
                        <select class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white bmi-input" id="fractionHeightMenu">
                            <option value="inch">Inch</option>
                            <option value="meter">Meter</option>
                            <option value="feet">Feet</option>
                            <option value="centimeter">Centimeter</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Weight inputs -->
            <div class="space-y-2">
                <label class="font-bold text-gray-700 block">Enter your weight:</label>
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-1 flex space-x-2">
                        <input class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bmi-input" id="intWeight" type="number" value="0">
                        <select class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white bmi-input" id="intWeightMenu">
                            <option value="kg">Kg</option>
                            <option value="gram">Gram</option>
                            <option value="pound">Pound</option>
                        </select>
                    </div>
                    
                    <div class="flex-1 flex space-x-2">
                        <input class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bmi-input" id="fractionWeight" type="number" value="0">
                        <select class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white bmi-input" id="fractionWeightMenu">
                            <option value="gram">Gram</option>
                            <option value="kg">Kg</option>
                            <option value="pound">Pound</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="flex flex-wrap gap-4 justify-center pt-2">
                <button id="submitButton" onclick="submit_button_click()" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                    Calculate BMI
                </button>
                <button id="refresh" onclick="refreshPage()" class="px-6 py-2 bg-gray-300 text-gray-700 font-medium rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors hidden">
                    Refresh
                </button>
            </div>

            <!-- Result display indicator -->
            <div id="realtime-indicator" class="hidden mt-3 text-center">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
                    <svg class="w-4 h-4 mr-1.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Auto-calculating...
                </span>
            </div>

            <!-- Result -->
            <div class="mt-6 p-4 bg-gray-50 rounded-md">
                <p id="result" class="text-center text-lg font-medium text-gray-700">Result will be shown here</p>
            </div>

            <!-- BMI Indicator -->
            <div id="indicator" class="hidden mt-6 p-6 bg-gray-50 rounded-md border border-gray-200">
                <p id="bmi" class="text-center text-xl font-bold mb-4">Your BMI will appear here</p>
                
                <div class="space-y-3">
                    <div id="underweight" class="p-3 rounded-md text-white bg-black transition-colors flex justify-between items-center sm:flex-row flex-col">
                        <span>Underweight: BMI less than 18.5</span>
                        <span id="range-underweight" class="text-sm font-semibold text-yellow-300"></span>
                    </div>
                    <div id="normal" class="p-3 rounded-md text-white bg-black transition-colors flex justify-between items-center sm:flex-row flex-col">
                        <span>Normal: BMI between 18.5 and 25.0</span>
                        <span id="range-normal" class="text-sm font-semibold text-green-300"></span>
                    </div>
                    <div id="overweight" class="p-3 rounded-md text-white bg-black transition-colors flex justify-between items-center sm:flex-row flex-col">
                        <span>Overweight: BMI between 25.0 and 30.0</span>
                        <span id="range-overweight" class="text-sm font-semibold text-orange-300"></span>
                    </div>
                    <div id="obese" class="p-3 rounded-md text-white bg-black transition-colors flex justify-between items-center sm:flex-row flex-col">
                        <span>Obese: BMI 30 or greater</span>
                        <span id="range-obese" class="text-sm font-semibold text-red-300"></span>
                    </div>
                </div>

                <div id="tips-container" class="mt-6 p-4 rounded-md bg-blue-50 border border-blue-200">
                    <h4 class="font-bold text-blue-800 mb-2">Health Tips:</h4>
                    <p id="tips" class="text-sm text-blue-800"></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
